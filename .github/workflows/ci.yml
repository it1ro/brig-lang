name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    all:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-go@v5
              with:
                  go-version-file: go.mod
                  cache: true

            - name: Install golangci-lint
              run: |
                  # Пин на тег: install.sh с master берёт latest, а у v2.14.0
                  # checksum в скрипте не сходится с архивом и job падает до make all.
                  curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v2.13.2/install.sh \
                    | sh -s -- -b "$(go env GOPATH)/bin" v2.13.2
                  echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

            - name: make all
              run: make all

