name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    all:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-go@v5
              with:
                  go-version-file: go.mod
                  cache: true

            - name: Install golangci-lint
              run: |
                  # Пин на тег: install.sh с master берёт latest, а у v2.14.0
                  # checksum в скрипте не сходится с архивом и job падает до make all.
                  curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v2.13.2/install.sh \
                    | sh -s -- -b "$(go env GOPATH)/bin" v2.13.2
                  echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

            - name: make all
              run: make all

    # -race на PR (T-114): параллельно all, отдельной job, чтобы не
    # увеличивать время make all.
    race:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-go@v5
              with:
                  go-version-file: go.mod
                  cache: true

            - name: make test-race
              run: make test-race

    # Гигиена меток (T-246): задача из title PR (`[T-NNN]`) не должна остаться в
    # needs манифеста корпуса и в pending(T-NNN) спеки — PR, закрывающий задачу,
    # сам снимает метки. Остальные закрытые задачи: make markers-check ONLINE=1.
    markers:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-go@v5
              with:
                  go-version-file: go.mod
                  cache: true

            - name: make markers-check
              env:
                  PR_TITLE: ${{ github.event.pull_request.title }}
              run: |
                  closed=$(printf '%s' "$PR_TITLE" | grep -oE '\[T-[0-9]+\]' | tr -d '[]' | paste -sd, -) || true
                  echo "закрываемые задачи: ${closed:-нет}"
                  make markers-check CLOSED="$closed"
